version: 1
database:
  url: ${DATABASE_URL}
worker:
  lease_timeout: 20s
  drain_timeout: 9s
listeners:
  - name: order_paid
    table: public.orders
    operations: [insert]
    timeout: 10s
    destination:
      url: https://hooks.example.test/order-paid
      signing:
        secrets:
          - ${SIGNING_SECRET}
          - ${SIGNING_SECRET_OLD}
