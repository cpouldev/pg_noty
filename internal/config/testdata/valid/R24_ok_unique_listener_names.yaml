version: 1
database:
  url: postgres://noty@db.internal/noty
listeners:
  - name: order_paid
    table: public.orders
    operations: [insert]
    destination:
      url: https://one.example.test/hook
  - name: order_archived
    table: public.orders_archive
    operations: [update]
    destination:
      url: https://two.example.test/hook
