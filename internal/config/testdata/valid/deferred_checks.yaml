version: 1
database:
  url: postgres://noty@db.internal/noty
listeners:
  - name: enabled_deferred
    enabled: true
    table: tenant.orders
    operations:
      insert:
        when: NEW.total > 0
      update:
        columns: [status, total]
        when: OLD.status IS DISTINCT FROM NEW.status
    payload:
      mode: keys_only
    destination:
      url: https://example.test/enabled
  - name: disabled_deferred
    enabled: false
    table: archive.orders
    operations:
      delete:
        when: OLD.cancelled
    payload:
      mode: keys_only
    destination:
      url: https://example.test/disabled
