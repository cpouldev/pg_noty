version: 1
database:
  url: postgres://noty@db.internal/noty
worker:
  poll_interval: 500µs
  lease_timeout: 2h
  drain_timeout: 2h
retention:
  keep: 168h
defaults:
  timeout: 1h30m
listeners:
  - name: duration_units
    table: public.orders
    operations: [insert]
    destination:
      url: https://example.test/durations
