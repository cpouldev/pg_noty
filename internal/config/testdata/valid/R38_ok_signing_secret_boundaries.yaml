version: 1
database:
  url: postgres://noty@db.internal/noty
listeners:
  - name: unsigned_hook
    table: public.orders
    operations: [insert]
    destination:
      url: https://hooks.example.test/unsigned
      signing:
        secrets: []
  - name: signed_hook
    table: public.orders_archive
    operations: [delete]
    destination:
      url: https://hooks.example.test/signed
      signing:
        secrets: ["${SIGNING_SECRET}"]
