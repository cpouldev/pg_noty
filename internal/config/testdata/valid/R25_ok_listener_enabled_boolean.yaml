version: 1
database:
  url: postgres://noty@db.internal/noty
listeners:
  - name: enabled_listener
    enabled: true
    table: public.orders
    operations: [insert]
    destination:
      url: https://example.test/enabled
  - name: disabled_listener
    enabled: false
    table: public.orders_archive
    operations: [insert]
    destination:
      url: https://example.test/disabled
