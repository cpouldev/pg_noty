version: 1
database:
  url: postgres://noty@db.internal/noty
defaults:
  retry:
    initial_interval: 1s
    max_interval: 2s
listeners:
  - name: order_paid
    table: public.orders
    operations: [insert]
    retry:
      initial_interval: 2s
      max_interval: 3s
    destination:
      url: https://example.test/override
  - name: inherited_retry
    table: public.orders_archive
    operations: [insert]
    destination:
      url: https://example.test/inherit
