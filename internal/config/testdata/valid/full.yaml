# The corrected configuration contract, written out so that every mapping level schema.go
# declares is reachable in one file: per-operation when and columns, signing.secrets as a
# list, and no destination.type.
version: 1
instance: noty

database:
  url: ${DATABASE_URL}
  schema: noty
  listen_url: ${DATABASE_LISTEN_URL}

worker:
  concurrency: 16
  batch_size: 100
  poll_interval: 10s
  lease_timeout: 5m
  drain_timeout: 30s

retention:
  keep: 168h
  partition_interval: 24h
  precreate: 168h

defaults:
  timeout: 5s
  retry:
    max_attempts: 5
    backoff: exponential
    initial_interval: 10s
    max_interval: 1h
    jitter: true
  headers:
    User-Agent: pgnoty/1

listeners:
  - name: order_paid
    enabled: true
    table: public.orders
    timeout: 10s
    concurrency: 4
    operations:
      insert: {}
      update:
        columns: [status, total]
        when: "OLD.status <> 'paid' AND NEW.status = 'paid'"
      delete: {}
    payload:
      mode: columns
      columns: [id, total, customer_id]
      include_old: true
      max_bytes: 262144
    destination:
      url: ${ORDER_WEBHOOK_URL}
      method: POST
      headers:
        X-Tenant: acme
      signing:
        secrets:
          - ${SIGNING_SECRET}
    retry:
      max_attempts: 10
