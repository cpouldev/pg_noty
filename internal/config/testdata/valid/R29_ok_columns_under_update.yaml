# R29's legality half, accepting: a column filter under the one statement it narrows, holding
# the one column that is the smallest legal filter.
version: 1
database:
  url: postgres://noty:pw@db.internal:5432/noty
listeners:
  - name: order_paid
    table: public.orders
    operations:
      update:
        columns: [status]
    destination:
      url: https://hooks.example.test/order-paid
