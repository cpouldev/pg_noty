version: 1
database:
  url: postgres://noty@db.internal/noty
worker:
  concurrency: 1024
listeners:
  - name: lower
    table: public.orders
    operations: [insert]
    concurrency: 1
    destination:
      url: https://example.test/lower
  - name: upper
    table: public.orders
    operations: [insert]
    concurrency: 1024
    destination:
      url: https://example.test/upper
