version: 1
database:
  url: postgres://noty@db.internal/noty
listeners:
  - name: http_hook
    table: public.orders
    operations: [insert]
    destination:
      url: http://hooks.example.test/plain
  - name: https_hook
    table: public.orders_archive
    operations: [delete]
    destination:
      url: https://hooks.example.test/tls
