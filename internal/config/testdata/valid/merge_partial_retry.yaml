version: 1
database:
  url: postgres://noty@db.internal/noty
defaults:
  retry:
    max_attempts: 6
    backoff: linear
    initial_interval: 11s
    max_interval: 2h
    jitter: false
listeners:
  - name: order_paid
    table: public.orders
    operations: [insert]
    destination:
      url: https://hooks.example.test/orders
    retry:
      max_attempts: 10
