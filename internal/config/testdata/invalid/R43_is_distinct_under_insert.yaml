# R43's placement clause: value comparisons apply only to updates with OLD and NEW rows.
# Inserts have no OLD row to compare.
version: 1
database:
  url: postgres://noty:pw@db.internal:5432/noty
listeners:
  - name: order_paid
    table: public.orders
    operations:
      insert:
        is_distinct: true
    destination:
      url: https://hooks.example.test/order-paid
