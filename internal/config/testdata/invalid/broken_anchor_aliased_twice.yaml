version: 1
listeners:
  - name: order_paid
    table: public.orders
    operations: [insert]
    payload:
      mode: columns
      columns: &shared_columns [id, total]
    retry:
      <<: *shared_columns
  - name: order_refunded
    table: public.orders
    operations: [delete]
    retry:
      <<: *shared_columns
